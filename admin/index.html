<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>SCUPER X · ADMIN CONTROL PANEL</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@600;700&family=Bebas+Neue&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        :root {
            --bg: #04020a;
            --card: rgba(10, 10, 25, 0.92);
            --card2: rgba(5, 5, 15, 0.85);
            --border: rgba(0, 240, 255, 0.2);
            --cyan: #00f0ff;
            --cyan-glow: rgba(0, 240, 255, 0.45);
            --purple: #9d4edd;
            --purple-glow: rgba(157, 78, 221, 0.5);
            --gold: #ffb703;
            --gold-glow: rgba(255, 183, 3, 0.5);
            --red: #ef4444;
            --green: #22c55e;
            --text: #e2e0eb;
            --dim: #737085;
            --dim2: #585061;
        }
        html, body {
            background: var(--bg);
            min-height: 100vh;
            font-family: 'Rajdhani', sans-serif;
            color: var(--text);
            overflow-x: hidden;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        /* Ambient Background */
        .bg-glow {
            position: fixed;
            inset: 0;
            pointer-events: none;
            background: 
                radial-gradient(ellipse at 50% 10%, rgba(157, 78, 221, 0.15) 0%, transparent 60%),
                radial-gradient(ellipse at 50% 90%, rgba(0, 240, 255, 0.1) 0%, transparent 60%);
            z-index: 0;
        }

        /* Container */
        .admin-container {
            width: 100%;
            max-width: 860px;
            min-height: 100vh;
            padding: 24px 16px;
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
        }

        /* LOGIN SCREEN */
        #adminLoginGate {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 80vh;
            transition: all 0.5s ease;
        }
        #adminLoginGate.hidden {
            display: none;
        }

        .lg-box {
            background: var(--card);
            border: 2px solid var(--purple);
            border-radius: 22px;
            padding: 38px 26px 30px;
            width: 100%;
            max-width: 380px;
            text-align: center;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 60px var(--purple-glow);
        }
        .lg-logo {
            font-family: 'Orbitron', sans-serif;
            font-size: 26px;
            font-weight: 900;
            background: linear-gradient(135deg, #fff, var(--cyan));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 2px;
            line-height: 1;
        }
        .lg-logo span {
            background: linear-gradient(135deg, var(--purple), #df73ff);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .lg-sub {
            font-size: 10px;
            letter-spacing: 3px;
            color: var(--gold);
            text-transform: uppercase;
            margin: 8px 0 24px;
            font-weight: 700;
            font-family: 'Orbitron', sans-serif;
        }
        .lg-input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(255, 255, 255, .03);
            border: 1.5px solid var(--border);
            border-radius: 12px;
            color: #fff;
            font-size: 14px;
            font-weight: 700;
            text-align: center;
            letter-spacing: 2px;
            transition: all .3s;
            font-family: 'Inter', sans-serif;
            margin-bottom: 10px;
        }
        .lg-input:focus {
            outline: none;
            border-color: var(--purple);
            background: rgba(157, 78, 221, .06);
            box-shadow: 0 0 25px var(--purple-glow);
        }
        .lg-btn {
            width: 100%;
            padding: 15px;
            margin-top: 10px;
            border: none;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            background: linear-gradient(135deg, var(--purple), #6c2bd9);
            color: #fff;
            cursor: pointer;
            box-shadow: 0 4px 28px var(--purple-glow);
            transition: all .25s;
            font-family: 'Inter', sans-serif;
        }
        .lg-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 36px var(--purple-glow);
        }
        .lg-btn:active { transform: scale(0.98); }
        .lg-err {
            color: var(--red);
            font-size: 12px;
            margin-top: 12px;
            min-height: 18px;
            font-weight: 600;
        }

        /* ADMIN DASHBOARD */
        #adminDashboard {
            width: 100%;
            display: none;
            flex-direction: column;
            gap: 20px;
            animation: fadeIn 0.5s ease forwards;
        }
        #adminDashboard.show {
            display: flex;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Header */
        .dash-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            background: var(--card);
            border: 1.5px solid var(--border);
            border-radius: 16px;
        }
        .dash-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 18px;
            font-weight: 900;
            background: linear-gradient(135deg, #fff, var(--gold));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 2px;
        }
        .dash-sub {
            font-size: 9px;
            color: var(--dim);
            letter-spacing: 1.5px;
            font-family: 'Orbitron', sans-serif;
            margin-top: 2px;
        }
        .logout-btn {
            padding: 8px 16px;
            border-radius: 8px;
            border: 1px solid rgba(239, 68, 68, 0.4);
            background: rgba(239, 68, 68, 0.1);
            color: var(--red);
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 1px;
            cursor: pointer;
            font-family: 'Orbitron', sans-serif;
            transition: all 0.2s;
        }
        .logout-btn:hover {
            background: rgba(239, 68, 68, 0.2);
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.3);
        }

        /* Cards */
        .panel-card {
            background: var(--card);
            border: 1.5px solid var(--border);
            border-radius: 18px;
            padding: 22px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            position: relative;
        }
        .card-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }
        .card-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 14px;
            font-weight: 800;
            color: var(--cyan);
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Form Grid */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 14px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .form-label {
            font-size: 9px;
            font-weight: 700;
            color: var(--dim);
            letter-spacing: 1.5px;
            font-family: 'Orbitron', sans-serif;
            text-transform: uppercase;
        }
        .form-input {
            width: 100%;
            padding: 12px 14px;
            background: rgba(255, 255, 255, 0.03);
            border: 1.5px solid var(--border);
            border-radius: 10px;
            color: #fff;
            font-size: 13px;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            transition: all 0.25s;
        }
        .form-input:focus {
            outline: none;
            border-color: var(--cyan);
            background: rgba(0, 240, 255, 0.04);
            box-shadow: 0 0 20px var(--cyan-glow);
        }

        /* Buttons */
        .act-btn {
            padding: 12px 18px;
            border-radius: 10px;
            border: 1.5px solid var(--border);
            background: var(--card2);
            color: #fff;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 1.5px;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            text-transform: uppercase;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .act-btn.primary {
            background: linear-gradient(135deg, var(--cyan), #0066cc);
            color: #000;
            border: none;
            box-shadow: 0 4px 20px var(--cyan-glow);
            width: 100%;
            padding: 14px;
            font-size: 12px;
        }
        .act-btn.primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 26px var(--cyan-glow);
        }
        .act-btn.danger {
            border-color: rgba(239, 68, 68, 0.3);
            color: var(--red);
            padding: 6px 10px;
            font-size: 9px;
        }
        .act-btn.danger:hover {
            background: rgba(239, 68, 68, 0.15);
            border-color: var(--red);
        }
        .act-btn.copy {
            border-color: rgba(0, 240, 255, 0.3);
            color: var(--cyan);
            padding: 6px 10px;
            font-size: 9px;
        }
        .act-btn.copy:hover {
            background: rgba(0, 240, 255, 0.15);
        }

        /* Table */
        .table-wrap {
            overflow-x: auto;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: var(--card2);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
            text-align: left;
        }
        thead th {
            padding: 12px 14px;
            font-size: 9px;
            font-weight: 800;
            color: var(--dim);
            letter-spacing: 1.5px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            background: rgba(255, 255, 255, 0.02);
            font-family: 'Orbitron', sans-serif;
            text-transform: uppercase;
        }
        tbody td {
            padding: 12px 14px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            color: var(--text);
            font-weight: 600;
            vertical-align: middle;
        }
        tbody tr:last-child td {
            border-bottom: none;
        }

        .cust-name {
            font-weight: 800;
            color: #fff;
        }
        .cust-id {
            font-size: 10px;
            color: var(--dim);
            font-family: 'Orbitron', sans-serif;
        }
        .key-text {
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            color: var(--gold);
            letter-spacing: 1px;
        }

        /* Status Badges */
        .badge {
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 9px;
            font-weight: 800;
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 1px;
            display: inline-block;
        }
        .badge-active {
            background: rgba(34, 197, 94, 0.12);
            border: 1px solid rgba(34, 197, 94, 0.4);
            color: var(--green);
        }
        .badge-expired {
            background: rgba(245, 158, 11, 0.12);
            border: 1px solid rgba(245, 158, 11, 0.4);
            color: var(--gold);
        }
        .badge-revoked {
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.4);
            color: var(--red);
        }

        .notify-msg {
            font-size: 11px;
            color: var(--green);
            margin-top: 10px;
            text-align: center;
            font-weight: 700;
            min-height: 16px;
        }

        @media(max-width:600px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <div class="bg-glow"></div>

    <div class="admin-container">

        <!-- ════════ ADMIN LOGIN GATE ════════ -->
        <div id="adminLoginGate">
            <div class="lg-box">
                <div class="lg-logo">SCUPER <span>X</span></div>
                <div class="lg-sub">⚡ ADMIN CONTROL PANEL ⚡</div>
                <input class="lg-input" id="adminUserInp" type="text" placeholder="ADMIN USERNAME" value="admin" autocomplete="off" spellcheck="false">
                <input class="lg-input" id="adminPassInp" type="password" placeholder="ADMIN PASSWORD" autocomplete="off" spellcheck="false">
                <button class="lg-btn" id="adminAuthBtn" onclick="doAdminLogin()">LOGIN</button>
                <div class="lg-err" id="adminAuthErr"></div>
            </div>
        </div>

        <!-- ════════ ADMIN DASHBOARD ════════ -->
        <div id="adminDashboard">

            <!-- Top Header -->
            <div class="dash-header">
                <div>
                    <div class="dash-title">SCUPER X ADMIN PANEL</div>
                    <div class="dash-sub">CUSTOMER-WISE UNIQUE KEY MANAGEMENT</div>
                </div>
                <button class="logout-btn" onclick="doAdminLogout()">LOGOUT</button>
            </div>

            <!-- Customer Key Generator Card -->
            <div class="panel-card">
                <div class="card-head">
                    <div class="card-title">
                        <span>➕ GENERATE UNIQUE CUSTOMER KEY</span>
                    </div>
                </div>

                <div class="form-grid">
                    <div class="form-group">
                        <label class="form-label">CUSTOMER NAME</label>
                        <input class="form-input" id="cNameInp" type="text" placeholder="e.g. John Doe" autocomplete="off">
                    </div>
                    <div class="form-group">
                        <label class="form-label">CUSTOMER ID / USERNAME (OPTIONAL)</label>
                        <input class="form-input" id="cIdInp" type="text" placeholder="e.g. CUST-101" autocomplete="off">
                    </div>
                </div>

                <button class="act-btn primary" onclick="generateCustomerKey()">🎲 GENERATE UNIQUE KEY FOR CUSTOMER</button>
                <div class="notify-msg" id="dashNotify"></div>
            </div>

            <!-- Customer Keys Management Table Card -->
            <div class="panel-card">
                <div class="card-head">
                    <div class="card-title">
                        <span>🔑 CUSTOMER ACCESS KEYS</span>
                    </div>
                    <button class="act-btn copy" onclick="fetchCustomerKeys()">🔄 REFRESH KEYS</button>
                </div>

                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>CUSTOMER</th>
                                <th>UNIQUE KEY</th>
                                <th>CREATED</th>
                                <th>EXPIRATION</th>
                                <th>STATUS</th>
                                <th>ACTIONS</th>
                            </tr>
                        </thead>
                        <tbody id="keysTbody">
                            <tr>
                                <td colspan="6" style="text-align:center; padding:20px; color:var(--dim);">Loading customer keys...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>

    </div>

    <script>
        let adminToken = localStorage.getItem('scuper_admin_token') || '';

        document.getElementById('adminPassInp').addEventListener('keydown', e => {
            if (e.key === 'Enter') doAdminLogin();
        });

        async function doAdminLogin() {
            const userInp = document.getElementById('adminUserInp');
            const passInp = document.getElementById('adminPassInp');
            const err = document.getElementById('adminAuthErr');
            const btn = document.getElementById('adminAuthBtn');

            const username = userInp ? userInp.value.trim() : 'admin';
            const password = passInp.value.trim();

            if (!password) {
                err.textContent = '❌ Please enter password';
                return;
            }

            btn.disabled = true;
            btn.textContent = 'LOGGING IN...';
            err.textContent = '';

            try {
                const res = await fetch('/api/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await res.json();

                if (res.ok && data.success) {
                    adminToken = data.token;
                    localStorage.setItem('scuper_admin_token', adminToken);
                    passInp.value = '';
                    showDashboard();
                } else {
                    err.textContent = data.message || '❌ Invalid Credentials';
                }
            } catch (e) {
                err.textContent = '❌ Connection Error to Backend';
            } finally {
                btn.disabled = false;
                btn.textContent = 'LOGIN';
            }
        }

        function doAdminLogout() {
            fetch('/api/admin/logout', {
                method: 'POST',
                headers: { 'Authorization': 'Bearer ' + adminToken }
            }).catch(() => {});

            adminToken = '';
            localStorage.removeItem('scuper_admin_token');
            document.getElementById('adminDashboard').classList.remove('show');
            document.getElementById('adminLoginGate').classList.remove('hidden');
        }

        async function fetchCustomerKeys() {
            if (!adminToken) return;

            try {
                const res = await fetch('/api/admin/customer-keys', {
                    headers: { 'Authorization': 'Bearer ' + adminToken }
                });

                if (res.status === 401 || res.status === 403) {
                    doAdminLogout();
                    return;
                }

                const data = await res.json();
                if (data.success) {
                    renderKeysTable(data.keys || []);
                }
            } catch (err) {
                console.error('Fetch keys error:', err);
            }
        }

        function formatDate(dateStr) {
            if (!dateStr) return '--';
            const d = new Date(dateStr);
            if (isNaN(d.getTime())) return dateStr.slice(0, 10);
            const day = String(d.getDate()).padStart(2, '0');
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const year = d.getFullYear();
            return `${day}-${month}-${year}`;
        }

        function renderKeysTable(keys) {
            const tbody = document.getElementById('keysTbody');
            if (!tbody) return;

            if (keys.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; padding:20px; color:var(--dim);">No customer keys generated yet</td></tr>`;
                return;
            }

            tbody.innerHTML = keys.map(k => {
                const name = k.customer_name || 'General Customer';
                const cid = k.customer_id ? `(${k.customer_id})` : '';
                const keyStr = k.raw_key || 'SCX-XXXX-XXXX';
                const created = k.created_at ? formatDate(k.created_at) : '--';
                const expiry = k.expires_at ? formatDate(k.expires_at) + ' 23:59:59' : '--';
                
                let badgeCls = 'badge-active';
                if (k.status === 'EXPIRED') badgeCls = 'badge-expired';
                if (k.status === 'REVOKED') badgeCls = 'badge-revoked';

                const isRevokable = k.status === 'ACTIVE';

                return `
                    <tr>
                        <td>
                            <div class="cust-name">${escapeHTML(name)}</div>
                            <div class="cust-id">${escapeHTML(cid)}</div>
                        </td>
                        <td><span class="key-text">${escapeHTML(keyStr)}</span></td>
                        <td>${created}</td>
                        <td>${expiry}</td>
                        <td><span class="badge ${badgeCls}">● ${k.status}</span></td>
                        <td>
                            <div style="display:flex; gap:6px; flex-wrap:wrap;">
                                <button class="act-btn copy" onclick="copyKeyText('${escapeHTML(keyStr)}')">📋 COPY</button>
                                ${isRevokable ? `<button class="act-btn danger" onclick="revokeCustomerKey(${k.id})">⛔ DEACTIVATE</button>` : ''}
                                <button class="act-btn danger" style="opacity:0.7" onclick="deleteCustomerKey(${k.id})">🗑 DELETE</button>
                            </div>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        async function generateCustomerKey() {
            const nameInp = document.getElementById('cNameInp');
            const idInp = document.getElementById('cIdInp');

            const customerName = nameInp.value.trim();
            const customerId = idInp.value.trim();

            if (!customerName) {
                showNotify('❌ Please enter customer name', 'var(--red)');
                nameInp.focus();
                return;
            }

            showNotify('Generating unique customer key...', 'var(--cyan)');
            try {
                const res = await fetch('/api/admin/generate-customer-key', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + adminToken 
                    },
                    body: JSON.stringify({ customerName, customerId })
                });

                const data = await res.json();
                if (data.success) {
                    showNotify(`⚡ Unique Key Created for ${customerName}!`, 'var(--green)');
                    nameInp.value = '';
                    idInp.value = '';
                    fetchCustomerKeys();
                } else {
                    showNotify('❌ ' + (data.message || 'Failed to generate key'), 'var(--red)');
                }
            } catch (err) {
                showNotify('❌ Connection error to backend', 'var(--red)');
            }
        }

        async function revokeCustomerKey(keyId) {
            if (!confirm('Are you sure you want to revoke this customer key?')) return;
            showNotify('Revoking customer key...', 'var(--gold)');
            try {
                const res = await fetch('/api/admin/revoke-customer-key', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + adminToken 
                    },
                    body: JSON.stringify({ keyId })
                });
                const data = await res.json();
                if (data.success) {
                    showNotify('⛔ Customer Key Revoked Successfully', 'var(--gold)');
                    fetchCustomerKeys();
                } else {
                    showNotify('❌ ' + (data.message || 'Failed to revoke key'), 'var(--red)');
                }
            } catch (err) {
                showNotify('❌ Connection error to backend', 'var(--red)');
            }
        }

        async function deleteCustomerKey(keyId) {
            if (!confirm('Are you sure you want to delete this customer key record permanently?')) return;
            showNotify('Deleting key record...', 'var(--red)');
            try {
                const res = await fetch('/api/admin/delete-customer-key', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + adminToken 
                    },
                    body: JSON.stringify({ keyId })
                });
                const data = await res.json();
                if (data.success) {
                    showNotify('🗑 Key Record Deleted Permanently', 'var(--green)');
                    fetchCustomerKeys();
                } else {
                    showNotify('❌ ' + (data.message || 'Failed to delete key'), 'var(--red)');
                }
            } catch (err) {
                showNotify('❌ Connection error to backend', 'var(--red)');
            }
        }

        function copyKeyText(keyStr) {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(keyStr).then(() => {
                    showNotify(`📋 Copied Key: ${keyStr}`, 'var(--cyan)');
                });
            } else {
                alert('Customer Key: ' + keyStr);
            }
        }

        function showNotify(msg, color = 'var(--green)') {
            const n = document.getElementById('dashNotify');
            n.textContent = msg;
            n.style.color = color;
            setTimeout(() => { if (n.textContent === msg) n.textContent = ''; }, 4000);
        }

        function escapeHTML(str) {
            return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
        }

        function showDashboard() {
            document.getElementById('adminLoginGate').classList.add('hidden');
            document.getElementById('adminDashboard').classList.add('show');
            fetchCustomerKeys();
        }

        // Auto check token on load
        if (adminToken) {
            showDashboard();
        }
    </script>
</body>
</html>
